name: Fetch docs page

# Manual-only diagnostic: the dev sandbox can't reach ignav.com, but the
# runners can. Prints a docs page as text so provider config can be
# checked against what Ignav actually supports. No secrets are used.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Docs URL to fetch
        default: https://ignav.com/docs/markets
        required: true
      head_lines:
        description: Print only the first N text lines (0 = everything + links)
        default: "0"
        required: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and print as text
        run: |
          # --compressed: the site serves gzip/brotli regardless; without
          # this flag curl writes the raw compressed bytes
          curl -sSL --compressed "${{ inputs.url }}" -o page.html
          # crude tag-strip so tables stay readable in the log
          python3 - <<'EOF'
          import html, os, re
          # head_lines > 0: only the first N text lines, no link dump —
          # log tails get truncated from the top, so this is the only way
          # to see the START of a big page in the run log
          head = int(os.environ.get("HEAD_LINES") or 0)
          raw = open("page.html", encoding="utf-8", errors="replace").read()
          raw = re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", raw,
                       flags=re.S | re.I)
          raw = re.sub(r"</(tr|p|div|li|h[1-6])>", "\n", raw, flags=re.I)
          raw = re.sub(r"</t[dh]>", " | ", raw, flags=re.I)
          text = html.unescape(re.sub(r"<[^>]+>", "", raw))
          shown = 0
          for line in text.splitlines():
              if line.strip():
                  print(line.strip()[:300])
                  shown += 1
                  if head and shown >= head:
                      print(f"--- CUT AT {head} LINES ---")
                      break
          if not head:
              # anchors lose their targets in the tag-strip; list them whole
              print("\n--- LINKS ---")
              for h in re.findall(r'href="([^"]+)"', raw):
                  if h.startswith("http"):
                      print("HREF:", html.unescape(h))
          EOF
        env:
          HEAD_LINES: ${{ inputs.head_lines }}
