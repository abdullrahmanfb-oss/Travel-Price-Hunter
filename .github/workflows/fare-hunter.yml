name: Fare Hunter

# Runs from GitHub's own runners, which have unrestricted internet — so
# the provider APIs are reachable with no allowlist to set. Your API
# keys live in the repo's encrypted Actions secrets, never in code or chat.
on:
  workflow_dispatch:          # the "Run workflow" button (manual)
    inputs:
      full_sweep:
        description: "Quote ALL configured markets this run (ignores pruning; ~120 requests)"
        type: boolean
        default: false
      archive_previous:
        description: "One-off: save the previous (v3) database as a 90-day artifact"
        type: boolean
        default: false
  schedule:
    - cron: '19 9 * * *'      # daily 09:19 UTC ≈ 12:19 PM Riyadh — keeps the
                              # scan inside Ignav's free 1,000 requests/month

permissions:
  contents: read
  pages: write            # publish the dashboard to GitHub Pages
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Carry price history between runs so drops, 30-day charts and
      # baselines build up over time instead of resetting each run.
      #
      # One-off archive (manual "archive_previous" input): pull the v3
      # database (Oct 9-19 trips: Lisbon/Bali/Almaty/Moscow/Edinburgh/
      # Shanghai) out of the cache and keep it as a downloadable run
      # artifact for 90 days. It never feeds the dashboard again.
      - name: Fetch previous history for archiving
        if: inputs.archive_previous == true
        uses: actions/cache/restore@v4
        with:
          path: hunter.db
          key: fare-hunter-db-v3-archive-${{ github.run_id }}
          restore-keys: |
            fare-hunter-db-v3-
      - name: Archive previous history
        if: inputs.archive_previous == true
        run: |
          mkdir -p archive
          if [ -f hunter.db ]; then
            mv hunter.db archive/hunter-oct-2026-trips.db
            echo "archived $(du -h archive/hunter-oct-2026-trips.db | cut -f1)"
          else
            echo "no previous database found in the cache"
          fi
      - name: Upload archive
        if: inputs.archive_previous == true
        uses: actions/upload-artifact@v4
        with:
          name: fare-hunter-archive-oct-2026-trips
          path: archive/
          retention-days: 90
          if-no-files-found: warn

      - name: Restore price history
        uses: actions/cache@v4
        with:
          path: hunter.db
          # v4: fresh start for the Nov 3-14 Lisbon/Porto search. The
          # v3 history (Oct 9-19, six routes) lives in the archive
          # artifact above, not on the dashboard.
          key: fare-hunter-db-v4-${{ github.run_id }}
          restore-keys: |
            fare-hunter-db-v4-

      # The calibration probe (scripts/probe_ignav.py) is deliberately NOT
      # run here any more: the API is calibrated and each probe run costs
      # ~5 successful (billed) requests — on a 4-hour schedule that alone
      # would burn ~900 of the 1,000 free requests per month. Run it
      # manually if the API shape ever changes.

      - name: Scan and report
        env:
          IGNAV_TOKEN: ${{ secrets.IGNAV_TOKEN }}
          IGNAV_DEBUG: "1"
          # set by the manual full_sweep input; empty on scheduled runs
          FULL_SWEEP: ${{ inputs.full_sweep == true && '1' || '' }}
          AMADEUS_KEY: ${{ secrets.AMADEUS_KEY }}
          AMADEUS_SECRET: ${{ secrets.AMADEUS_SECRET }}
          # Set this secret to https://api.amadeus.com once you move your
          # Amadeus app to production; otherwise the free test host is used.
          AMADEUS_HOSTNAME: ${{ secrets.AMADEUS_HOSTNAME }}
          KIWI_API_KEY: ${{ secrets.KIWI_API_KEY }}
          # StayAPI: Google Hotels (home market, 1 call) + Booking.com
          # per market (config.yaml hotels.stayapi_markets, ~7 calls) per
          # hotel watch per run. ~50 free calls on the free tier.
          STAYAPI_KEY: ${{ secrets.STAYAPI_KEY }}
          STAYAPI_DEBUG: "1"
        run: |
          # --- watches (idempotent; add lines here to track more flights) ---
          # Nov 3 -> 14, exact dates (no flex), max 1 stop, all markets.
          # Focus carriers get their own same-flight market windows from
          # the same scan at zero extra requests. The Oct 9-19 watches
          # (Lisbon/Bali/Almaty/Moscow/Edinburgh/Shanghai) were retired
          # with the v4 database; their history is in the archive
          # artifact, not on the dashboard.
          # Flights are PAUSED for now (owner's call: hotels only). The
          # watches stay in the cached database; `pause` keeps them off
          # the scan (~10 min, hundreds of Ignav calls) and the digest.
          # To bring them back: uncomment the two blocks and drop the
          # two `pause` lines.
          python hunt.py pause riyadh-lisbon
          python hunt.py pause riyadh-porto
          # python hunt.py flight riyadh-lisbon \
          #   --slice RUH:LIS:2026-11-03 --slice LIS:RUH:2026-11-14 \
          #   --target-eco 2100 --max-stops 1 \
          #   --focus SV --focus EY --focus QR --focus EK \
          #   --focus LH --focus KL --focus TK --focus TP
          # python hunt.py flight riyadh-porto \
          #   --slice RUH:OPO:2026-11-03 --slice OPO:RUH:2026-11-14 \
          #   --target-eco 2100 --max-stops 1 \
          #   --focus SV --focus EY --focus QR --focus EK \
          #   --focus LH --focus KL --focus TK --focus TP
          # Hotels (StayAPI Booking.com, per market). One property, one
          # room type, Nov 4 -> 9, 2 adults. ~7 StayAPI calls per run
          # (6 markets + Google), plus a one-off hotel-id lookup.
          # For "cheapest hotel in the city" drop --hotel/--room.
          python hunt.py hotel ibis-lisboa-airport --city LIS \
            --checkin 2026-11-04 --checkout 2026-11-09 --adults 2 \
            --hotel "Ibis Styles Lisboa Aeroporto" --room "Luxury Suite"

          echo "::group::Active providers"
          python hunt.py providers
          echo "::endgroup::"

          echo "::group::Digest (scan + alerts)"
          python hunt.py digest --dry-run
          echo "::endgroup::"

          echo "::group::Same flight, every market"
          python scripts/print_matrix.py
          echo "::endgroup::"

          python hunt.py dashboard --out dashboard.html

      # Download this from the run's Summary page to open the full dashboard.
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fare-hunter-dashboard
          path: dashboard.html

      # Stage it as a Pages site (index.html) for the deploy job.
      - name: Stage Pages site
        run: |
          mkdir -p site
          cp dashboard.html site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes the dashboard to a live GitHub Pages URL. Kept separate so a
  # Pages problem (e.g. not yet enabled) never fails the scan or its log.
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
