# Fare Hunter configuration.
# Watches are NOT here — they live in SQLite (python hunt.py flight|hotel|car).
# This file holds the things that rarely change: who to email, when,
# search tuning, and the markets (points of sale) to fan out across.

user:
  email: Abdullrahman.fb@gmail.com

digest:
  hour_utc: 5            # matches the cron example in the README

alerts:
  # Flag an offer when a non-SA market beats the SA price for the same
  # thing by at least this much (after SAR normalisation). 50% cheaper
  # abroad => flagged; 10% => info line only.
  market_edge_pct: 25

search:
  # Tuned for free/test provider tiers, which rate-limit hard. The old
  # 90/min with 6 workers produced ~90% HTTP failures. Raise slowly and
  # watch the error line printed after a scan.
  requests_per_minute: 30
  deep_margin: 0.12      # phase-2 entry: within 12% of the leader
  max_deep_combos: 6     # at most 6 (provider, market) pairs get the grid
  workers: 3

# 32 markets: the owner's chosen set — the 31 generally-cheapest points
# of sale (ranked) plus the home market. All confirmed supported by
# ignav.com/docs/markets. POS/currency are passed as API parameters —
# the supported path. Every currency here must have an FX rate in
# hunt.py:fx_rates().
points_of_sale:
  - {code: SA, currency: SAR}   # home market — edge is measured against it
  - {code: EG, currency: EGP}
  - {code: AR, currency: ARS}
  - {code: NG, currency: NGN}
  - {code: PK, currency: PKR}
  - {code: BD, currency: BDT}
  - {code: LK, currency: LKR}
  - {code: NP, currency: NPR}
  - {code: IN, currency: INR}
  - {code: ID, currency: IDR}
  - {code: VN, currency: VND}
  - {code: TR, currency: TRY}
  - {code: UA, currency: UAH}
  - {code: KE, currency: KES}
  - {code: TZ, currency: TZS}
  - {code: UG, currency: UGX}
  - {code: GH, currency: GHS}
  - {code: TN, currency: TND}
  - {code: MA, currency: MAD}
  - {code: PH, currency: PHP}
  - {code: KH, currency: KHR}
  - {code: KR, currency: KRW}
  - {code: BO, currency: BOB}
  - {code: PY, currency: PYG}
  - {code: CO, currency: COP}
